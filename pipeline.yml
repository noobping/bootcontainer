on:
  pre-commit: [check]
  pre-push: [check]
  pre-receive: [check]

pipelines:
  check:
    jobs:
      just:
        just: check-just
      whitespace:
        just: check-whitespace
      shell:
        just: check-shell

  online-images:
    needs: [check]
    jobs:
      build:
        just: online::stable

  online-media:
    needs: [check]
    jobs:
      build:
        just: online::media

  online:
    needs: [online-images, online-media]

  next:
    needs: [check]
    jobs:
      build:
        just: online::next

  offline:
    needs: [check]
    jobs:
      build:
        just: offline-build

  offline-workstation:
    needs: [check]
    jobs:
      build:
        just: offline-workstation-build

  offline-nas:
    needs: [check]
    jobs:
      build:
        just: offline-nas-build

  offline-sway:
    needs: [check]
    jobs:
      build:
        just: offline-sway-build

  release:
    needs: [online]
    jobs:
      publish:
        just: online::release

  image-task:
    jobs:
      build:
        just: online::image-task

  manifest-preflight:
    jobs:
      verify:
        just: online::manifest-preflight

  manifest-task:
    jobs:
      publish:
        just: online::manifest-task

  media-task:
    jobs:
      build:
        just: online::media-task

  release-assets:
    jobs:
      publish:
        just: online::release-assets

  offline-task:
    jobs:
      build:
        just: offline-task
