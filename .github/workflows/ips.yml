name: IPS

on:
  push:
    branches:
      - main
      - master
    paths:
      - "images/ips/**"
      - ".github/workflows/ips.yml"
      - "!**/*.md"

  schedule:
    - cron: "59 00 * * *"

  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/noobping/ips

concurrency:
  group: ips
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.stream.name }} ${{ matrix.arch.name }}
    continue-on-error: ${{ matrix.stream.name == 'next' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runs_on: ubuntu-latest
          - name: arm64
            runs_on: ubuntu-24.04-arm
        stream:
          - name: stable
            fcos_stream: stable
            tag: latest
            suffix: ""
          - name: next
            fcos_stream: next
            tag: next
            suffix: "-next"

    runs-on: ${{ matrix.arch.runs_on }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git jq \
            podman buildah skopeo \
            fuse-overlayfs uidmap slirp4netns
          sudo update-ca-certificates

          buildah --version
          podman --version
          skopeo --version

      - name: Storage
        run: |
          sudo mkdir -p /mnt/containers /mnt/runcontainers /mnt/tmp
          sudo chown -R "$USER:$USER" /mnt/containers /mnt/runcontainers /mnt/tmp

          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/mnt/runcontainers/storage"
          graphroot = "/mnt/containers/storage"

          [storage.options]
          mount_program = "/usr/bin/fuse-overlayfs"
          EOF

          buildah info

      - name: Repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Build
        working-directory: images/ips
        env:
          TMPDIR: /mnt/tmp
        run: |
          IMAGE="${IMAGE_NAME}:${{ matrix.arch.name }}${{ matrix.stream.suffix }}"
          DIGEST_FILE="${RUNNER_TEMP}/ips-${{ matrix.stream.name }}-${{ matrix.arch.name }}.digest"

          buildah bud \
            --pull-always \
            --isolation=chroot \
            -t "$IMAGE" \
            --label org.opencontainers.image.source="${{ github.repositoryUrl }}" \
            --build-arg FCOS_STREAM="${{ matrix.stream.fcos_stream }}" \
            .

          buildah push --digestfile "$DIGEST_FILE" "$IMAGE" "docker://$IMAGE"

          buildah rmi "$IMAGE" || true
          buildah prune -f || true

      - name: Record image digest
        uses: actions/upload-artifact@v4
        with:
          name: ips-digest-${{ matrix.stream.name }}-${{ matrix.arch.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ips-${{ matrix.stream.name }}-${{ matrix.arch.name }}.digest
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Manifest ${{ matrix.stream.name }}
    if: ${{ always() && !cancelled() }}
    continue-on-error: ${{ matrix.stream.name == 'next' }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stream:
          - name: stable
            tag: latest
            suffix: ""
          - name: next
            tag: next
            suffix: "-next"

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Current image digests
        uses: actions/download-artifact@v4
        with:
          pattern: ips-digest-${{ matrix.stream.name }}-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ips-digests
          merge-multiple: true

      - uses: sigstore/cosign-installer@v3

      - name: Repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          set -euxo pipefail
          metadata="${RUNNER_TEMP}/manifest.json"
          amd64_digest="$(tr -d '\r\n' < "${RUNNER_TEMP}/ips-digests/ips-${{ matrix.stream.name }}-amd64.digest")"
          arm64_digest="$(tr -d '\r\n' < "${RUNNER_TEMP}/ips-digests/ips-${{ matrix.stream.name }}-arm64.digest")"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --metadata-file "$metadata" \
            -t "${IMAGE_NAME}:${{ matrix.stream.tag }}" \
            "${IMAGE_NAME}@${amd64_digest}" \
            "${IMAGE_NAME}@${arm64_digest}"
          digest="$(jq -r '."containerimage.descriptor".digest' "$metadata")"
          cosign sign --yes --recursive "${IMAGE_NAME}@${digest}"
